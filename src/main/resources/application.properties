# EN:    SolidSign XAdES (XML) signature validation example
#        Run: mvn spring-boot:run
#        Batch: POST http://localhost:8096/api/xml/validate/batch
#        Form:  POST http://localhost:8096/api/xml/validate/form
#
# PT-BR: Exemplo de validação de assinatura XAdES (XML)
#        Executar: mvn spring-boot:run
#        Lote: POST http://localhost:8096/api/xml/validate/batch
#        Form: POST http://localhost:8096/api/xml/validate/form

server.port=8096

solidsign.api.base-url=http://localhost:8080
solidsign.api.authorization=Bearer eyJ...

# Batch mode: directory containing signed XML files
solidsign.batch.input-path=C:/signed_xml
solidsign.batch.output-path=C:/validation_results

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
